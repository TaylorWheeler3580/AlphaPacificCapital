<style>
:root{
  --ink:#0E1419; --ink-2:#1B2530; --ink-3:#2B3947;
  --paper:#E8EBEE; --card:#FFFFFF; --rule:#DBE0E5; --rule-soft:#EDF0F3;
  --text:#0E1419; --muted:#5B6672; --dim:#949CA6;
  --pos:#0B8F63; --warn:#B4741A; --accent:#2F6FED;
  --disp:#2F6FED; --soc:#7C5CFF; --sem:#DD8A16; --call:#0E9F6E;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--text); font-size:14px; line-height:1.45;
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif; font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1240px; margin:0 auto; padding:0 22px 60px}
.eyebrow{font-size:10.5px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--dim)}

.rail{background:var(--ink); color:#fff}
.rail-in{max-width:1240px; margin:0 auto; padding:16px 22px 0}
.rail-top{display:flex; justify-content:space-between; align-items:baseline; gap:20px; flex-wrap:wrap}
.rail-top h1{margin:0; font-size:19px; font-weight:600; letter-spacing:-.015em}
.rail-top h1 span{color:#7E8B99; font-weight:400}
.rail-meta{font-size:11.5px; color:#7E8B99}
.rail-strip{max-width:1240px; margin:14px auto 0; padding:9px 22px; display:flex; gap:18px;
  flex-wrap:wrap; border-top:1px solid #212C38; font-size:11.5px; color:#8794A2}
.rail-strip b{color:#D6DDE4; font-weight:600}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--rule); flex-wrap:wrap; margin-top:18px}
.tabs button{appearance:none; border:0; background:none; cursor:pointer; font-family:inherit;
  font-size:13.5px; font-weight:500; color:var(--muted); padding:11px 18px;
  border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .13s,border-color .13s}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text); font-weight:600; border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.tabs button i{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:8px;
  vertical-align:0; background:var(--accent)}

#ctx:empty{display:none}
.ctx-bar{background:var(--card); border:1px solid var(--rule); border-left:3px solid var(--accent);
  border-radius:4px; margin-top:14px; padding:14px 18px; display:flex; gap:30px;
  align-items:center; flex-wrap:wrap}
.ctx-stat{display:flex; flex-direction:column; gap:2px}
.ctx-stat b{font-size:21px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.ctx-stat span{font-size:10.5px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase}
.ctx-line{flex:1; min-width:230px; font-size:12.5px; color:var(--muted); line-height:1.5}
.ctx-line b{color:var(--text); font-weight:600}
.panel{background:var(--card); border:1px solid var(--rule); border-radius:4px; margin-top:14px}
.panel-h{padding:15px 18px 0; display:flex; justify-content:space-between;
  align-items:baseline; gap:14px; flex-wrap:wrap}
.panel-h h2{margin:0; font-size:14.5px; font-weight:600}
.panel-h .sub{font-size:11.5px; color:var(--muted)}
.panel-b{padding:14px 18px 18px}
.note{font-size:11.5px; color:var(--muted); line-height:1.5; margin:12px 0 0}
.note.warn{color:var(--warn)}
.empty{font-size:12px; color:var(--muted); padding:10px 0}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0}
.kpi{padding:4px 20px 4px 0}
.kpi + .kpi{padding-left:20px; border-left:1px solid var(--rule-soft)}
.kpi b{display:block; font-size:29px; font-weight:600; letter-spacing:-.025em; line-height:1.1}
.kpi span{font-size:11.5px; color:var(--muted)}
.kpi em{display:block; font-style:normal; font-size:10.5px; color:var(--dim); margin-top:2px}

.ch-wrap{border-top:1px solid var(--rule-soft)}
.ch-wrap:first-child{border-top:0}
.ch-body{padding:2px 0 18px}
.chev{color:var(--dim); font-size:11px; transition:transform .18s; text-align:center}
.ch-wrap[data-open="1"] .chev{transform:rotate(90deg)}
button.ch{width:100%; background:none; border:0; font-family:inherit; color:inherit;
  text-align:left; cursor:pointer; border-top:0}
button.ch:hover{background:#FAFBFC}
button.ch:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.ch{display:grid; grid-template-columns:minmax(110px,1fr) minmax(90px,1.2fr) repeat(4,minmax(54px,.7fr)) 22px;
  gap:12px; align-items:center; padding:10px 0}
.ch-name{display:flex; align-items:center; gap:9px; font-weight:600; font-size:13.5px}
.dot{width:8px; height:8px; border-radius:50%; flex:0 0 8px}
.track{height:7px; background:var(--rule-soft); border-radius:1px; overflow:hidden}
.track i{display:block; height:100%; border-radius:1px}
.num{text-align:right; font-size:13px; font-family:"IBM Plex Mono",monospace}
.num small{display:block; font-size:9.5px; color:var(--dim); font-weight:500; letter-spacing:.05em;
  text-transform:uppercase; font-family:Archivo,sans-serif}

.dt{width:100%; border-collapse:collapse; font-size:12.5px}
.dt caption{text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--dim); padding-bottom:7px}
.dt th{text-align:right; font-weight:500; font-size:10px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--dim); padding:0 0 6px 10px; border-bottom:1px solid var(--rule)}
.dt th:first-child{text-align:left; padding-left:0}
.dt td{padding:7px 0 7px 10px; border-bottom:1px solid var(--rule-soft); text-align:right;
  font-family:"IBM Plex Mono",monospace; font-size:12px}
.dt td:first-child{text-align:left; padding-left:0; font-family:Archivo,sans-serif; font-size:12.5px}
.dt tr:last-child td{border-bottom:0}
.dt .sub{display:block; font-size:10.5px; color:var(--dim); font-family:Archivo,sans-serif}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:24px}

.call{border:1px solid var(--rule); border-radius:3px; padding:13px 15px; margin-top:10px}
.call-h{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:baseline}
.call-h b{font-size:13px}
.call-h span{font-size:11.5px; color:var(--muted); font-family:"IBM Plex Mono",monospace}
.call p{margin:9px 0 0; font-size:12.5px; line-height:1.55; color:var(--text)}
.call a{color:var(--accent); font-size:11.5px; text-decoration:none; border-bottom:1px solid currentColor}
.tag{display:inline-block; padding:1px 7px; border-radius:2px; font-size:9.5px; font-weight:600;
  letter-spacing:.06em; text-transform:uppercase; border:1px solid currentColor; margin-left:7px}
.tag.ok{color:var(--pos)}

.bar-row{display:grid; grid-template-columns:150px 1fr 66px; gap:12px; align-items:center;
  padding:7px 0; border-top:1px solid var(--rule-soft); font-size:12.5px}
.bar-row:first-of-type{border-top:0}
.bar-row .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-row .v{text-align:right; font-family:"IBM Plex Mono",monospace}

footer{margin-top:26px; padding-top:14px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between;
  gap:18px; flex-wrap:wrap}
a.site{color:var(--accent); text-decoration:none}
a.site:hover{text-decoration:underline}
@media (max-width:820px){
  .ch{grid-template-columns:minmax(100px,1fr) repeat(3,minmax(52px,1fr))}
  .ch .track-cell{display:none}
  .kpi{padding:8px 0; border-left:0!important}
}
@media print{
  .tabs{display:none!important}
  [data-tabhide]{display:block!important}
  body{background:#fff}
  .panel{break-inside:avoid}
}
</style>

const CH_COLOR = {Display:"var(--disp)", Social:"var(--soc)", SEM:"var(--sem)"};
const CH_ORDER = ["Display","Social","SEM"];
const state = {tab:"ALL", open:{}};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n0 = v => Math.round(Number(v)||0).toLocaleString("en-US");
const n1 = v => (Number(v)||0).toLocaleString("en-US",{maximumFractionDigits:1});
const pct = v => (Number(v)||0).toFixed(Number(v)>=10?1:2)+"%";
const compact = v => { v=Number(v)||0; return v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e4?Math.round(v/1e3)+"K":n0(v); };
const secs = v => { const m=Math.floor(v/60), r=v%60; return m?`${m}m ${r}s`:`${r}s`; };
const props = () => state.tab === "ALL" ? D.order : [state.tab];
const isAll = () => state.tab === "ALL";
const accent = () => isAll() ? "#2F6FED" : D.properties[state.tab].accent;

function chanTotals(){
  const out = {};
  props().forEach(p => {
    const c = D.properties[p].channels;
    for (const ch in c){
      const t = out[ch] || (out[ch] = {impressions:0,clicks:0,visits:0,conversions:0,engagement:0,leads:0});
      for (const k in t) t[k] += c[ch][k]||0;
    }
  });
  return CH_ORDER.filter(c => out[c]).map(c => ({channel:c, ...out[c]}));
}
function grand(){
  const t = {impressions:0,clicks:0,visits:0,conversions:0,engagement:0,leads:0};
  chanTotals().forEach(r => { for (const k in t) t[k] += r[k]||0; });
  return t;
}
function tbl(caption, head, rows, empty){
  if (!rows.length) return `<div><div class="eyebrow">${caption}</div><p class="empty">${empty||"Not reported."}</p></div>`;
  return `<table class="dt"><caption>${caption}</caption><thead><tr>${
    head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

/* ---------- tabs ---------- */
function paintTabs(){
  $("tabs").innerHTML = [["ALL","All three"]].concat(D.order.map(p => [p, D.properties[p].name]))
    .map(([k,l]) => `<button role="tab" data-t="${k}" aria-selected="${state.tab===k}">${
      k==="ALL"?"":`<i style="background:${D.properties[k].accent}"></i>`}${esc(l)}</button>`).join("");
  $("tabs").onclick = e => { const b=e.target.closest("button"); if(!b) return;
    state.tab = b.dataset.t; state.open = {}; render(); };
}

/* ---------- panels ---------- */
function accountTotals(){
  const t = {impressions:0, clicks:0, leads:0, conversions:0};
  D.order.forEach(p => {
    const c = D.properties[p].channels;
    for (const ch in c){
      t.impressions += c[ch].impressions||0; t.clicks += c[ch].clicks||0;
      t.leads += c[ch].leads||0; t.conversions += c[ch].conversions||0;
    }
  });
  return t;
}
function paintCtx(){
  if (isAll()){ $("ctx").innerHTML = ""; return; }
  const p = D.properties[state.tab];
  const me = grand(), all = accountTotals();
  const share = all.impressions ? me.impressions/all.impressions*100 : 0;
  const rank = D.order.map(k => {
    const c = D.properties[k].channels;
    return {k, v: Object.values(c).reduce((s,x)=>s+(x.impressions||0),0)};
  }).sort((a,b)=>b.v-a.v).findIndex(x => x.k === state.tab) + 1;
  const ran = CH_ORDER.filter(c => p.channels[c]);
  const missing = CH_ORDER.filter(c => !p.channels[c]);
  $("ctx").innerHTML = `<div class="ctx-bar">
    <div class="ctx-stat"><b class="mono">${pct(share)}</b><span>of account impressions</span></div>
    <div class="ctx-stat"><b class="mono">#${rank}</b><span>of ${D.order.length} properties</span></div>
    <div class="ctx-stat"><b class="mono">${me.leads?n0(me.leads):"—"}</b><span>leads</span></div>
    <p class="ctx-line"><b>${esc(p.name)}</b> is running ${ran.join(", ")}${
      missing.length?` · no ${missing.join(", ")}`:""}.</p>
  </div>`;
}
function paintKPIs(){
  const t = grand();
  const ctr = t.impressions ? t.clicks/t.impressions*100 : 0;
  const cells = [
    ["Impressions", n0(t.impressions), ""],
    ["Clicks", n0(t.clicks), pct(ctr)+" CTR"],
    ["Leads", n0(t.leads), t.leads ? "Meta lead forms" : "none recorded"],
    ["Conversions", n0(t.conversions), "all tracked actions"],
  ];
  $("kpiTitle").textContent = isAll() ? "Delivery — all three properties" : "Delivery";
  $("kpiSub").textContent = D.period;
  $("kpis").innerHTML = cells.map(([l,v,n]) =>
    `<div class="kpi"><b class="mono">${v}</b><span>${l}</span><em>${n}</em></div>`).join("");
}

function paintChannels(){
  const rows = chanTotals();
  const max = Math.max(...rows.map(r=>r.impressions), 1);
  $("chSub").textContent = rows.length ? `Select a tactic for detail` : "";
  $("channels").innerHTML = rows.length ? rows.map(r => {
    const open = !!state.open[r.channel];
    return `<div class="ch-wrap" data-open="${open?1:0}">
      <button class="ch" data-ch="${r.channel}" aria-expanded="${open}">
        <span class="ch-name"><i class="dot" style="background:${CH_COLOR[r.channel]}"></i>${r.channel}</span>
        <span class="track-cell"><span class="track"><i style="width:${Math.max(2,r.impressions/max*100)}%;background:${CH_COLOR[r.channel]}"></i></span></span>
        <span class="num">${n0(r.impressions)}<small>impr</small></span>
        <span class="num">${n0(r.clicks)}<small>clicks</small></span>
        <span class="num">${r.impressions?pct(r.clicks/r.impressions*100):"—"}<small>ctr</small></span>
        <span class="num">${r.leads?n0(r.leads):(r.conversions?n0(r.conversions):"—")}<small>${r.leads?"leads":"conv"}</small></span>
        <span class="chev">▶</span>
      </button>
      ${open ? `<div class="ch-body">${tacticDetail(r)}</div>` : ""}
    </div>`;
  }).join("")
    : `<p class="empty">No tactics attributed to this property.</p>`;
  // append the campaign table before wiring handlers: assigning innerHTML again
  // would re-parse the container and drop the listeners
  const camp = props().flatMap(p => D.properties[p].campaigns.map(c => ({...c, prop:p})));
  if (camp.length && isAll()) $("channels").insertAdjacentHTML("beforeend",
    `<div style="margin-top:18px">${
      tbl("Campaigns", ["Campaign","Impr.","Clicks","CTR","Property"],
        camp.sort((a,b)=>b.impressions-a.impressions).map(c => [
          esc(c.name), n0(c.impressions), n0(c.clicks), pct(c.ctr),
          esc(D.properties[c.prop].name)]))}</div>`);

  $("channels").querySelectorAll("button.ch").forEach(b => b.onclick = () => {
    state.open[b.dataset.ch] = !state.open[b.dataset.ch]; paintChannels();
  });
}

function tacticDetail(r){
  const S = D.shared, P = [];
  const mine = props();
  const camp = mine.flatMap(p => D.properties[p].campaigns
    .filter(c => c.channel === r.channel).map(c => ({...c, prop:p})));

  if (r.channel === "Social"){
    const onyxOnly = !isAll();
    if (S.metaReach) P.push(`<div><div class="eyebrow">Reach</div>
      <div class="kpis" style="margin-top:8px">
        <div class="kpi"><b class="mono">${n0(S.metaReach.reach)}</b><span>People reached</span>
          <em>unique accounts</em></div>
        <div class="kpi"><b class="mono">${S.metaReach.frequency.toFixed(2)}×</b><span>Frequency</span>
          <em>times each saw an ad</em></div>
        <div class="kpi"><b class="mono">${r.leads&&S.metaReach.reach
          ? (r.leads/S.metaReach.reach*100).toFixed(2)+"%" : "—"}</b><span>Lead rate</span>
          <em>leads per person reached</em></div>
      </div></div>`);
    if (S.metaPlatform) P.push(tbl("Facebook vs Instagram",
      ["Platform","Impr.","Clicks","CTR","Leads"],
      S.metaPlatform.map(x => [esc(x.name==="facebook"?"Facebook":"Instagram"),
        n0(x.impressions), n0(x.clicks), pct(x.ctr), n0(x.leads)])));
    if (S.metaMonthly) P.push(tbl("By month", ["Month","Impr.","Clicks","CTR","Leads"],
      S.metaMonthly.slice().sort((a,b)=>a.date<b.date?-1:1).map(x => [
        esc(x.date.replace("08-","Aug ").replace("09-","Sep ")),
        n0(x.impressions), n0(x.clicks), pct(x.ctr), n0(x.leads)])));
    if (S.metaGender) P.push(tbl("Gender", ["Gender","Impr.","Clicks","CTR","Leads"],
      S.metaGender.map(x => [esc(x.name[0].toUpperCase()+x.name.slice(1)),
        n0(x.impressions), n0(x.clicks), pct(x.ctr), n0(x.leads)])));
    if (S.metaPost) P.push(tbl("Engagement", ["Interaction","Count"],
      [["Post engagements", n0(S.metaPost.engagement)],
       ["Link clicks", n0(S.metaPost.clicks)],
       ["Reactions", n0(S.metaPost.reactions)],
       ["Shares", n0(S.metaPost.shares)],
       ["Page likes", n0(S.metaPost.likes)]]));
    return `<div class="cols">${P.join("")}</div>
      <p class="note">${onyxOnly
        ? "Meta runs only for The Onyx, so every figure in this section belongs to this property."
        : "Meta runs only for The Onyx; these figures are that campaign."}
        Leads are Meta lead-form submissions and have not been matched against leasing records.</p>`;
  }

  if (r.channel === "Display"){
    P.push(tbl("Campaigns", ["Campaign","Impr.","Clicks","CTR","Visits"],
      camp.sort((a,b)=>b.impressions-a.impressions).map(c => [
        esc(c.name), n0(c.impressions), n0(c.clicks), pct(c.ctr),
        c.visits?n0(c.visits):"0"])));
    const cr = mine.flatMap(p => (D.properties[p].creatives["Display sizes"]||[])
      .map(c => ({...c, prop:p})));
    if (cr.length) P.push(tbl("By banner size", ["Size","Impr.","Clicks","CTR"],
      cr.sort((a,b)=>b.impressions-a.impressions).map(c => [
        esc(c.size||"—"), n0(c.impressions), n0(c.clicks), pct(c.ctr)])));
    if (S.devices.length) P.push(tbl("Devices", ["Device","Impr.","Clicks"],
      S.devices.map(x => [esc(x.name), n0(x.impressions), n0(x.clicks)])));
    if (S.fences.length) P.push(tbl("Target fences", ["Fence","Impr."],
      S.fences.slice().sort((a,b)=>b.impressions-a.impressions).slice(0,6)
        .map(f => [esc(f.name), n0(f.impressions)])));
    return `<div class="cols">${P.join("")}</div>
      <p class="note">Devices and target fences are reported for the whole geofencing
      buy, not per property. No foot-traffic visits have registered yet.</p>`;
  }

  // SEM
  const ags = mine.flatMap(p => D.properties[p].adGroups.map(a => ({...a, prop:p})));
  P.push(tbl("Ad groups", ["Ad group","Impr.","Clicks","CTR","Conv."],
    ags.sort((a,b)=>b.impressions-a.impressions).map(a => [
      esc(a.name), n0(a.impressions), n0(a.clicks), pct(a.ctr),
      a.conversions?n0(a.conversions):"—"])));
  const sets = kwFor();
  if (sets.length) P.push(tbl("Top keywords", ["Keyword","Ad group","Impr.","Clicks","CTR"],
    sets.flatMap(x => x.rows).sort((a,b) => b.impr - a.impr).slice(0, 10)
      .map(k => [esc(k.kw), esc(k.group), n0(k.impr), n0(k.clicks), pct(k.ctr)])));
  if (S.semDevices) P.push(tbl("Devices", ["Device","Impr.","Clicks","CTR"],
    S.semDevices.map(x => [esc(x.name), n0(x.impressions), n0(x.clicks), pct(x.ctr)])));
  if (S.semGeo) P.push(tbl("Cities", ["City","Impr.","Clicks"],
    S.semGeo.slice().sort((a,b)=>b.impressions-a.impressions).slice(0,6)
      .map(x => [`${esc(x.name)}<span class="sub">${esc(x.state)}</span>`,
        n0(x.impressions), n0(x.clicks)])));
  return `<div class="cols">${P.join("")}</div>
    <p class="note">Ad groups carry the property name; devices, cities and generic
    keywords are reported for the account as a whole.</p>`;
}

function paintCreative(){
  const groups = {};
  props().forEach(p => {
    const cr = D.properties[p].creatives;
    for (const g in cr) (groups[g] = groups[g] || []).push(...cr[g].map(c => ({...c, prop:p})));
  });
  const keys = Object.keys(groups);
  $("crSub").textContent = keys.length ? "By tactic" : "";
  if (!keys.length){ $("creative").innerHTML = `<p class="empty">No creative reported for this property.</p>`; return; }
  $("creative").innerHTML = `<div class="cols">${keys.map(g => {
    const rows = groups[g].sort((a,b)=>b.impressions-a.impressions);
    return tbl(g, ["Creative", ...(g==="Display sizes"?["Size"]:[]), "Impr.","Clicks","CTR"],
      rows.map(c => [
        `${esc(c.name)}${isAll()?`<span class="sub">${esc(D.properties[c.prop].name)}</span>`:""}`,
        ...(g==="Display sizes"?[esc(c.size||"—")]:[]),
        n0(c.impressions), n0(c.clicks), pct(c.ctr)]));
  }).join("")}</div>
  <p class="note">Creative is attributed by the property named in each file. The banner set runs
  one creative per property across several sizes.</p>`;
}

function kwFor(){
  const out = [];
  props().forEach(p => { if (KW[p]) out.push({prop:p, ...KW[p]}); });
  return out;
}
function kwTable(sets, limit){
  const rows = sets.flatMap(s => s.rows.map(r => ({...r, prop:s.prop})));
  rows.sort((a,b) => b.impr - a.impr);
  const many = sets.length > 1;
  const shown = limit ? rows.slice(0, limit) : rows;
  const head = ["Keyword","Match", many ? "Property" : "Ad group",
                "Impr.","Clicks","CTR","Conv."];
  const body = shown.map(r => [
    esc(r.kw),
    '<span style="color:var(--muted)">' + esc(r.match) + '</span>',
    esc(many ? D.properties[r.prop].name : r.group),
    n0(r.impr), n0(r.clicks), pct(r.ctr),
    r.conv ? n1(r.conv) : "\u2014"]);
  let out = tbl("Keywords", head, body);
  if (limit && rows.length > limit)
    out += '<p class="note">Showing the top ' + limit + ' of ' + rows.length +
           ' keywords that served impressions.</p>';
  return out;
}
function paintSEM(){
  const ags = props().flatMap(p => D.properties[p].adGroups.map(a => ({...a, prop:p})));
  const kw  = props().flatMap(p => D.properties[p].keywords.map(k => ({...k, prop:p, branded:true})));
  const shared = isAll() ? D.shared.keywords.map(k => ({...k, branded:false})) : [];
  const semTot = D.shared.channels.SEM || {};
  const attributed = ags.reduce((s,a)=>s+a.impressions,0);

  const sets = kwFor();
  $("semSub").textContent = (ags.length || sets.length) ? "Ad groups and keywords" : "";
  if (!ags.length && !sets.length){
    $("sem").innerHTML = '<p class="empty">No search activity for this property.</p>';
    return;
  }

  const grp = [];
  sets.forEach(x => Object.entries(x.groups).forEach(([g,v]) =>
    grp.push({name:g, prop:x.prop, impr:v.impr, clicks:v.clicks, conv:v.conv, n:v.n})));
  const idle   = sets.reduce((t,x) => t + x.idle, 0);
  const rarely = sets.reduce((t,x) => t + x.rarely, 0);
  const tot    = sets.reduce((t,x) => ({impr: t.impr + x.totals.impr,
                                        clicks: t.clicks + x.totals.clicks,
                                        conv: t.conv + x.totals.conv}),
                             {impr:0, clicks:0, conv:0});

  const kpiRow = sets.length ? '<div class="kpis" style="margin-bottom:16px">' +
    '<div class="kpi"><b class="mono">' + n0(tot.impr) + '</b><span>Impressions</span></div>' +
    '<div class="kpi"><b class="mono">' + n0(tot.clicks) + '</b><span>Clicks</span><em>' +
      (tot.impr ? pct(tot.clicks/tot.impr*100) : "\u2014") + ' CTR</em></div>' +
    '<div class="kpi"><b class="mono">' + (tot.conv ? n1(tot.conv) : "\u2014") +
      '</b><span>Conversions</span></div>' +
    '<div class="kpi"><b class="mono">' + sets.reduce((t,x) => t + x.rows.length, 0) +
      '</b><span>Active keywords</span><em>' + idle + ' served nothing</em></div>' +
    '</div>' : "";

  const groupTable = grp.length
    ? tbl("Ad groups",
        ["Ad group"].concat(isAll() ? ["Property"] : []).concat(["Impr.","Clicks","CTR","Keywords"]),
        grp.sort((a,b) => b.impr - a.impr).map(g =>
          [esc(g.name)].concat(isAll() ? [esc(D.properties[g.prop].name)] : [])
            .concat([n0(g.impr), n0(g.clicks),
                     g.impr ? pct(g.clicks/g.impr*100) : "\u2014", n0(g.n)])))
    : tbl("Ad groups",
        ["Ad group"].concat(isAll() ? ["Property"] : []).concat(["Impr.","Clicks","CTR","Conv."]),
        ags.sort((a,b) => b.impressions - a.impressions).map(a =>
          [esc(a.name)].concat(isAll() ? [esc(D.properties[a.prop].name)] : [])
            .concat([n0(a.impressions), n0(a.clicks), pct(a.ctr),
                     a.conversions ? n0(a.conversions) : "\u2014"])));

  const note = sets.length
    ? rarely + ' keyword' + (rarely === 1 ? ' is' : 's are') +
      ' marked by Google as rarely served \u2014 eligible, but too low-volume to enter ' +
      'auctions, so worth pruning or re-phrasing.'
    : 'Ad groups carry the property name; generic keywords are reported for the account as a whole.';

  $("sem").innerHTML = kpiRow +
    '<div class="cols">' + groupTable + '</div>' +
    (sets.length ? '<div style="margin-top:22px">' + kwTable(sets, isAll() ? 20 : 0) + '</div>' : "") +
    '<p class="note">' + note + '</p>';
}

function paintGeo(){
  const g = D.shared.geo.slice().sort((a,b)=>b.impressions-a.impressions);
  const fences = D.shared.fences.slice().sort((a,b)=>b.impressions-a.impressions);
  const zones = D.shared.zones;
  const max = Math.max(...g.map(r=>r.impressions), 1);
  $("geoSub").textContent = isAll() ? "Account level — not reported by property" : "Account level";
  $("geo").innerHTML = `
    <div class="eyebrow">Cities reached</div>
    <div style="margin-top:8px">${g.map(r => `
      <div class="bar-row">
        <span class="nm">${esc(r.city)}<span class="sub" style="color:var(--dim)"> ${esc(r.state)}</span></span>
        <span class="track"><i style="width:${Math.max(2,r.impressions/max*100)}%;background:${accent()}"></i></span>
        <span class="v">${n0(r.impressions)}</span>
      </div>`).join("")}</div>
    <div class="cols" style="margin-top:22px">
      ${tbl("Target fences", ["Fence","Impr.","Clicks"],
        fences.map(f => [esc(f.name), n0(f.impressions), f.clicks?n0(f.clicks):"—"]))}
      ${tbl("Conversion zones", ["Property address","Visits"],
        zones.map(z => [esc(z.name), z.visits?n0(z.visits):"0"]),
        "No conversion zones reported.")}
    </div>
    <p class="note warn">No foot-traffic visits have been recorded yet. Geofencing attribution
    typically needs several weeks of delivery before visits register, and this campaign has
    been live since 19 August.</p>
    <p class="note">Geography is reported for the account as a whole, so these figures cover
    all three properties regardless of the tab selected.</p>`;
}

/* ---------- render ---------- */
function render(){
  document.documentElement.style.setProperty("--accent", accent());
  paintTabs();
  $("railMeta").textContent = D.period;
  $("footPeriod").textContent = D.period;
  const p = isAll() ? null : D.properties[state.tab];
  $("footSite").innerHTML = p ? `<a class="site" href="${p.site}" target="_blank" rel="noopener">${p.site.replace(/^https?:\/\//,"").replace(/\/$/,"")} ↗</a>` : "";
  $("strip").innerHTML = [
    `<span>Source: <b>pulseMax report</b></span>`,
    `<span>Flight: <b>${D.period}</b></span>`,
    isAll() ? `<span>Showing <b>all three properties</b></span>`
            : `<span>Showing <b>${esc(p.name)}</b></span>`,
    `<span style="color:#E5B96B">First three weeks of delivery — read early figures with care.</span>`,
  ].join("");
  paintCtx(); paintKPIs(); paintChannels(); paintCreative(); paintSEM(); paintGeo();
}
render();
</script>
</body></html>
